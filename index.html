    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111318">
    <title>UID Checker · ROGxSMS</title>
    <script>
        (function () {
            var theme = "dark";
            try { theme = localStorage.getItem("rogxsms_uid_theme") || "dark"; } catch (e) { }
            if (theme !== "light") theme = "dark";
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = theme === "light" ? "#f4f6f8" : "#111318";
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

        /* ===== style.css ===== */
        :root, [data-theme="dark"] {
            --bg: #111318; --card: #1a1d26; --elev: #22262f; --line: #2e3340;
            --txt: #e8eaed; --dim: #8b919e; --mute: #5f6573;
            --cyan: #00d4aa; --cyan-d: #00b894; --live: #00d4aa; --dead: #ff6b6b;
            --warn: #ffc048; --rate: #a29bfe;
            --accent-soft: rgba(0, 212, 170, 0.06); --accent-soft-2: rgba(0, 212, 170, 0.03);
            --accent-border: rgba(0, 212, 170, 0.35); --accent-border-2: rgba(0, 212, 170, 0.45);
            --accent-border-3: rgba(0, 212, 170, 0.3); --accent-hover: rgba(0, 212, 170, 0.14);
            --run-done-bg: rgba(0, 212, 170, 0.06); --run-done-border: rgba(0, 212, 170, 0.25);
            --err-bg: rgba(255, 107, 107, 0.08); --err-border: rgba(255, 107, 107, 0.2);
            --err-txt: #ffaaaa; --live-ph: rgba(0, 212, 170, 0.35); --dead-ph: rgba(255, 107, 107, 0.35);
            --btn-run-fg: #0a0f0d; --spin-track: rgba(0, 0, 0, 0.15);
            --mono: ui-monospace, Consolas, monospace; --font: "DM Sans", system-ui, sans-serif;
            --r: 12px; --safe-b: env(safe-area-inset-bottom, 0px);
        }
        [data-theme="light"] {
            --bg: #f4f6f8; --card: #ffffff; --elev: #eef1f5; --line: #d8dee6;
            --txt: #1a1d26; --dim: #5f6573; --mute: #8b919e;
            --cyan: #00a884; --cyan-d: #009572; --live: #00a884; --dead: #e53935;
            --warn: #e6a000; --rate: #7c6fe6;
            --accent-soft: rgba(0, 168, 132, 0.08); --accent-soft-2: rgba(0, 168, 132, 0.05);
            --accent-border: rgba(0, 168, 132, 0.35); --accent-border-2: rgba(0, 168, 132, 0.45);
            --accent-border-3: rgba(0, 168, 132, 0.3); --accent-hover: rgba(0, 168, 132, 0.14);
            --run-done-bg: rgba(0, 168, 132, 0.08); --run-done-border: rgba(0, 168, 132, 0.25);
            --err-bg: rgba(229, 57, 53, 0.08); --err-border: rgba(229, 57, 53, 0.25);
            --err-txt: #c62828; --live-ph: rgba(0, 168, 132, 0.45); --dead-ph: rgba(229, 57, 53, 0.45);
            --btn-run-fg: #ffffff; --spin-track: rgba(255, 255, 255, 0.35);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            min-height: 100vh; min-height: 100dvh; font-family: var(--font); font-size: 15px;
            color: var(--txt); background: var(--bg); line-height: 1.5; -webkit-font-smoothing: antialiased;
        }
        .app { max-width: 920px; margin: 0 auto; padding: 0 20px calc(28px + var(--safe-b)); }
        /* header */
        .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 28px; font-size: 0.9rem; font-weight: 600; }
        .hdr-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .hdr-logo { color: var(--cyan); }
        .hdr-sep { color: var(--mute); font-weight: 400; }
        .hdr-app { color: var(--dim); }
        .theme-btn {
            display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 7px 12px;
            border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--dim);
            font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            transition: color 0.12s, border-color 0.12s, background 0.12s;
        }
        .theme-btn:hover { color: var(--txt); border-color: var(--dim); }
        .theme-btn svg { width: 16px; height: 16px; }
        .theme-btn .ico-moon { display: none; }
        [data-theme="light"] .theme-btn .ico-sun { display: none; }
        [data-theme="light"] .theme-btn .ico-moon { display: block; }
        [data-theme="dark"] .theme-btn .theme-txt::after { content: "Light"; }
        [data-theme="light"] .theme-btn .theme-txt::after { content: "Dark"; }
        .theme-btn .theme-txt { font-size: 0; }
        .theme-btn .theme-txt::after { font-size: 0.78rem; }
        /* run bar */
        .run-bar {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px;
            border-radius: var(--r); background: var(--elev); border: 1px solid var(--line);
            font-size: 0.84rem; font-weight: 600; color: var(--dim); font-variant-numeric: tabular-nums;
        }
        .run-bar.done { border-color: var(--run-done-border); color: var(--live); background: var(--run-done-bg); }
        .run-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; animation: blink 1.2s ease infinite; }
        .run-bar.done .run-dot { animation: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        /* card */
        .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
        .seg { display: flex; gap: 4px; padding: 3px; margin-bottom: 14px; border-radius: 9px; background: var(--bg); }
        .seg-btn {
            flex: 1; min-height: 38px; border: none; border-radius: 7px; background: transparent;
            color: var(--mute); font-family: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer;
            transition: color 0.12s, background 0.12s;
        }
        .seg-btn.active { background: var(--elev); color: var(--txt); }
        .pane { display: none; }
        .pane.active { display: block; }
        .in-ta {
            width: 100%; min-height: 200px; padding: 14px; border: 1px solid var(--line); border-radius: 9px;
            background: var(--bg); color: var(--txt); font-family: var(--mono); font-size: 0.84rem;
            line-height: 1.65; resize: vertical; outline: none; transition: border-color 0.15s;
        }
        .in-ta:focus { border-color: var(--accent-border-2); }
        .in-ta::placeholder { color: var(--mute); }
        .in-foot { margin-top: 8px; font-size: 0.78rem; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; }
        /* drop */
        .drop {
            display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 44px 16px;
            border: 1.5px dashed var(--line); border-radius: 9px; background: var(--bg); text-align: center;
            cursor: pointer; transition: border-color 0.15s, background 0.15s;
        }
        .drop:hover, .drop.dragover { border-color: var(--accent-border); background: var(--accent-soft-2); }
        .drop.has-file { border-style: solid; border-color: var(--accent-border-3); }
        .drop-txt { font-weight: 600; font-size: 0.92rem; }
        .drop-sub { font-size: 0.78rem; color: var(--mute); }
        .drop-file { margin-top: 8px; font-size: 0.82rem; color: var(--dim); word-break: break-all; }
        .drop.has-file .drop-file { color: var(--live); font-weight: 600; }
        /* actions */
        .act { display: flex; gap: 10px; margin-top: 14px; }
        .btn-run {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 44px; padding: 0 20px; border: none; border-radius: 9px; background: var(--cyan);
            color: var(--btn-run-fg); font-family: inherit; font-size: 0.92rem; font-weight: 700;
            cursor: pointer; text-decoration: none; transition: background 0.12s, transform 0.1s; user-select: none;
        }
        .btn-run:hover:not(:disabled) { background: var(--cyan-d); }
        .btn-run:active:not(:disabled) { transform: scale(0.98); }
        .btn-run:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-run.is-loading { pointer-events: none; }
        .btn-spin { width: 15px; height: 15px; border: 2px solid var(--spin-track); border-top-color: var(--btn-run-fg); border-radius: 50%; animation: spin 0.55s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-reset { min-width: 80px; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--dim); font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
        .btn-reset:hover:not(:disabled) { color: var(--txt); border-color: var(--dim); }
        .err { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-txt); font-size: 0.84rem; }
        /* metrics */
        .metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
        .m { padding: 12px 8px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); text-align: center; }
        .m b { display: block; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; }
        .m span { font-size: 0.62rem; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }
        .m-live b { color: var(--live); }
        .m-dead b { color: var(--dead); }
        .m-warn b { color: var(--warn); }
        .m-rate b { color: var(--rate); }
        /* output */
        .out { margin-top: 14px; }
        .out-grid { display: grid; gap: 12px; }
        @media (min-width: 640px) { .out-grid { grid-template-columns: 1fr 1fr; } }
        .out-box { border-radius: var(--r); border: 1px solid var(--line); background: var(--card); overflow: hidden; }
        .out-live { border-top: 2px solid var(--live); }
        .out-dead { border-top: 2px solid var(--dead); }
        .out-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.84rem; font-weight: 600; }
        .out-top em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--dim); margin-left: 4px; }
        .out-live .out-top em { color: var(--live); }
        .out-dead .out-top em { color: var(--dead); }
        .out-actions { display: flex; align-items: center; gap: 6px; }
        .btn-dl { padding: 4px 10px; border: 1px solid var(--accent-border); border-radius: 6px; background: var(--accent-soft); color: var(--live); font-family: inherit; font-size: 0.76rem; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
        .btn-dl:hover { background: var(--accent-hover); border-color: var(--accent-border); }
        .btn-copy { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--dim); font-family: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
        .btn-copy:hover { color: var(--txt); }
        .btn-copy:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-copy:disabled:hover { color: var(--dim); }
        .btn-copy.copied { color: var(--live); border-color: var(--accent-border-3); }
        .out-wrap { position: relative; min-height: 180px; }
        .out-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 0.82rem; color: var(--mute); pointer-events: none; user-select: none; }
        .out-live .out-ph { color: var(--live-ph); }
        .out-dead .out-ph { color: var(--dead-ph); }
        .out-wrap.has-content .out-ph { display: none; }
        .out-ta { width: 100%; min-height: 180px; max-height: 360px; padding: 12px; border: none; background: var(--bg); color: var(--txt); font-family: var(--mono); font-size: 0.82rem; line-height: 1.6; resize: none; outline: none; overflow-y: auto; overflow-x: auto; white-space: pre; tab-size: 4; }
        .out-wrap:not(.has-content) .out-ta { color: transparent; caret-color: transparent; }
        @media (min-width: 640px) { .out-ta { min-height: 240px; max-height: 420px; } }
        .out-sub { display: none; }
        /* footer */
        .foot { margin-top: 28px; padding: 16px 0 8px; text-align: center; }
        .foot p { font-size: 0.78rem; color: var(--mute); }
        .foot a { color: var(--dim); font-weight: 600; text-decoration: none; transition: color 0.15s ease; }
        .foot a:hover { color: var(--cyan); }
        .hidden { display: none !important; }
        /* mobile */
        @media (max-width: 639px) {
            .app { padding: 0 14px calc(16px + var(--safe-b)); }
            .hdr { padding: 16px 0 20px; }
            .theme-btn { padding: 6px 10px; }
            .metrics { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .m { padding: 10px 4px; }
            .m b { font-size: clamp(0.9rem, 3.8vw, 1.1rem); }
            .m span { font-size: 0.58rem; }
            .foot { margin-top: 20px; padding: 12px 0 4px; }
            .in-ta { min-height: 160px; }
            .act { position: sticky; bottom: calc(6px + var(--safe-b)); z-index: 40; padding-top: 8px; background: linear-gradient(transparent, var(--bg) 50%); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<body>
    <div class="app" id="appRoot" data-max-uids="100000" data-max-mb="25"
        data-batch-pause-ms="0" data-batch-size="100000">

        <header class="hdr">
            <div class="hdr-brand">
                <span class="hdr-logo">ROGxSMS</span>
                <span class="hdr-sep">/</span>
                <span class="hdr-app">UID Checker</span>
            </div>
            <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch to light theme">
                <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="theme-txt" id="themeLabel">Light</span>
            </button>
        </header>

        <main class="main">
            <div class="run-bar hidden" id="statusStrip" role="status" aria-live="polite">
                <span class="run-dot"></span>
                <span id="statusText">Checking…</span>
            </div>

            <section class="card">
                <div class="seg" role="tablist">
                    <button type="button" class="seg-btn active" data-tab="paste" role="tab" id="tab-paste"
                        aria-selected="true" aria-controls="pane-paste">Paste</button>
                    <button type="button" class="seg-btn" data-tab="file" role="tab" id="tab-file" aria-selected="false"
                        aria-controls="pane-file">Upload</button>
                </div>

                <div class="pane active" id="pane-paste" role="tabpanel">
                    <textarea id="uidInput" class="in-ta" placeholder="Paste UIDs here, one per line"
                        spellcheck="false"></textarea>
                    <div class="in-foot">
                        <span id="uidCount">0 / 100,000</span>
                    </div>
                </div>

                <div class="pane" id="pane-file" role="tabpanel" hidden>
                    <label class="drop" id="dropzone" for="fileInput">
                        <input type="file" id="fileInput" accept=".xlsx,.csv,.txt" hidden>
                        <span class="drop-txt">Choose file or drop here</span>
                        <span class="drop-sub">.xlsx · .csv · .txt · max 25 MB</span>
                        <span class="drop-file" id="fileName">No file selected</span>
                    </label>
                </div>

                <div class="act">
                    <button type="button" class="btn-run" id="checkBtn">
                        <span class="btn-label">Check</span>
                        <span class="btn-spin hidden" id="checkSpinner"></span>
                    </button>
                    <button type="button" class="btn-reset" id="clearBtn">Clear</button>
                </div>

                <div class="err hidden" id="errorBanner" role="alert"></div>
            </section>

            <div class="metrics" id="statsPanel">

            var kicked = false;
            var startHost = host;

            function isEditableTarget(el) {
                if (!el || !el.tagName) return false;
                var tag = el.tagName.toLowerCase();
                return tag === "input" || tag === "textarea" || el.isContentEditable;
            }
            function isWebView() {
                var ua = navigator.userAgent || "";
                return /Telegram|FBAN|FBAV|Instagram|Line\/|wv\)/i.test(ua);
            }
            function attemptClose() {
                try { window.opener = null; } catch (err) { }
                try { window.close(); } catch (err) { }
                try { self.close(); } catch (err) { }
                try { window.open("", "_self").close(); } catch (err) { }
                try { var blankWin = window.open("about:blank", "_self"); if (blankWin) { blankWin.close(); } } catch (err) { }
                try { if (window.top && window.top !== window) { window.top.close(); } } catch (err) { }
            }
            function forceLeave() {
                if (location.hostname !== startHost) { return; }
                try {
                    if (history.length > 1) {
                        history.go(-1);
                        setTimeout(function () { if (location.hostname === startHost) { location.replace(EXIT_URL); } }, 120);
                        return;
                    }
                } catch (err) { }
                location.replace(EXIT_URL);
            }
            function kickOut() {
                if (kicked) return;
                kicked = true;
                attemptClose();
                var tries = 0;
                var timer = setInterval(function () { attemptClose(); tries += 1; if (tries >= 20) { clearInterval(timer); } }, 40);
                setTimeout(function () { if (location.hostname === startHost) { forceLeave(); } }, isWebView() ? 500 : 180);
            }
            function devtoolsOpenBySize() {
                var gap = 170;
                return (window.outerWidth - window.innerWidth > gap || window.outerHeight - window.innerHeight > gap);
            }
            function devtoolsOpenByDebugger() {
                var start = performance.now();

            }
            function checkDevTools() {
                if (kicked) return;

            }
            function isDevToolsShortcut(e) {
                var key = (e.key || "").toLowerCase();
                var code = e.keyCode || e.which;
                if (key === "f12" || code === 123) return true;
                if (e.ctrlKey && e.shiftKey) {
                    return (key === "i" || key === "j" || key === "c" || key === "k" || code === 73 || code === 74 || code === 67 || code === 75);
                }
                if (e.metaKey && e.altKey && (key === "i" || key === "j" || code === 73 || code === 74)) { return true; }
                if (e.ctrlKey && !e.shiftKey && (key === "u" || code === 85)) return true;
                return false;
            }
            document.addEventListener("contextmenu", function (e) { if (isEditableTarget(e.target)) return; e.preventDefault(); }, true);

            document.addEventListener("keyup", function (e) { if (isDevToolsShortcut(e)) { e.preventDefault(); e.stopPropagation(); return false; } }, true);
            window.addEventListener("resize", checkDevTools);
            window.addEventListener("focus", checkDevTools);
            document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDevTools(); });
            setInterval(checkDevTools, 800);
            checkDevTools();
        })();

        /* ===== app.js ===== */
        (function () {
            const THEME_KEY = "rogxsms_uid_theme";

            const uidInput = document.getElementById("uidInput");

            const checkBtn = document.getElementById("checkBtn");
            const checkBtnLabel = checkBtn && checkBtn.querySelector(".btn-label");
            const checkSpinner = document.getElementById("checkSpinner");
            const clearBtn = document.getElementById("clearBtn");
            const errorBanner = document.getElementById("errorBanner");
            const statusStrip = document.getElementById("statusStrip");
            const statusText = document.getElementById("statusText");
            const resultsSection = document.getElementById("resultsSection");
            const resultsGrid = document.getElementById("resultsGrid");
            const resultsSub = document.getElementById("resultsSub");
            const liveOutput = document.getElementById("liveOutput");
            const deadOutput = document.getElementById("deadOutput");
            const liveOutputWrap = liveOutput && liveOutput.parentElement;
            const deadOutputWrap = deadOutput && deadOutput.parentElement;
            const liveEmpty = document.getElementById("liveEmpty");
            const deadEmpty = document.getElementById("deadEmpty");
            const statLive = document.getElementById("statLive");
            const statDead = document.getElementById("statDead");
            const statChecked = document.getElementById("statChecked");
            const statInFile = document.getElementById("statInFile");
            const statDup = document.getElementById("statDup");
            const statRate = document.getElementById("statRate");
            const liveCountBadge = document.getElementById("liveCountBadge");
            const deadCountBadge = document.getElementById("deadCountBadge");
            const downloadBtn = document.getElementById("downloadBtn");
            const themeBtn = document.getElementById("themeBtn");

            function getTheme() { return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
            function updateThemeMeta(theme) { const meta = document.querySelector('meta[name="theme-color"]'); if (meta) { meta.content = theme === "light" ? "#f4f6f8" : "#111318"; } }
            function updateThemeButton() { if (!themeBtn) return; const isLight = getTheme() === "light"; themeBtn.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme"); }
            function setTheme(theme) {
                const next = theme === "light" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                try { localStorage.setItem(THEME_KEY, next); } catch (err) { }
                updateThemeMeta(next);
                updateThemeButton();
            }

            let activeTab = "paste";
            let selectedFile = null;
            let checking = false;
            let liveCount = 0;
            let deadCount = 0;
            let jobMeta = { inFile: 0, duplicates: 0, invalid: 0 };
            let liveCursor = 0;
            let deadCursor = 0;
            let displayChecked = 0;
            let checkTotal = 0;
            let progressPollTimer = null;
            let pollInFlight = false;

            function updateEmptyStates() {
                const liveHas = !!liveOutput.value.trim();
                const deadHas = !!deadOutput.value.trim();
                if (liveOutputWrap) { liveOutputWrap.classList.toggle("has-content", liveHas); }
                if (deadOutputWrap) { deadOutputWrap.classList.toggle("has-content", deadHas); }
                if (liveEmpty) { liveEmpty.textContent = checking && !liveHas ? "Checking…" : "Live UIDs will appear here"; }
                if (deadEmpty) { deadEmpty.textContent = checking && !deadHas ? "Checking…" : "Dead UIDs will appear here"; }
                document.querySelectorAll('.copy-btn[data-copy="live"]').forEach(function (btn) { btn.disabled = !liveHas; });
                document.querySelectorAll('.copy-btn[data-copy="dead"]').forEach(function (btn) { btn.disabled = !deadHas; });
            }
            function updateStatusStrip(data, done) {
                if (!statusStrip || !statusText) return;
                const live = data.live != null ? Number(data.live) : liveCount;
                const dead = data.dead != null ? Number(data.dead) : deadCount;
                const checked = data.checked != null ? Number(data.checked) : displayChecked || live + dead;
                const total = Number(data.unique_total) || Number(data.total_unique) || checkTotal || checked;
                const rate = live + dead > 0 ? ((live / (live + dead)) * 100).toFixed(1) : null;
                if (done) {
                    statusStrip.classList.remove("hidden");
                    statusStrip.classList.add("done");
                    statusText.textContent = formatNumber(live) + " live · " + formatNumber(dead) + " dead" + (rate != null ? " · " + rate + "%" : "");
                    return;
                }
                if (checking) {
                    statusStrip.classList.remove("hidden", "done");
                    let msg = "Checking";
                    if (total > 0) { msg += " · " + formatNumber(checked) + " / " + formatNumber(total); }
                    if (rate != null) { msg += " · " + rate + "% live"; }
                    statusText.textContent = msg;
                }
            }
            function hideStatusStrip() { if (statusStrip) { statusStrip.classList.add("hidden"); statusStrip.classList.remove("done"); } }
            function stopProgressPoll() { if (progressPollTimer) { clearInterval(progressPollTimer); progressPollTimer = null; } }
            function setCheckingState(active) {
                if (!checkBtn) return;
                checkBtn.classList.toggle("is-loading", active);
                checkBtn.disabled = active;
                if (checkBtnLabel) { checkBtnLabel.textContent = active ? "Checking…" : "Check"; }
                if (checkSpinner) { checkSpinner.classList.toggle("hidden", !active); }
                updateEmptyStates();
            }
            function setJobMeta(data) {
                const unique = data.total_unique || 0;
                const dup = data.duplicates_removed || 0;
                const invalid = data.invalid || 0;
                jobMeta = { inFile: unique + dup, duplicates: dup, invalid: invalid };
                statInFile.textContent = formatNumber(jobMeta.inFile);
                statDup.textContent = formatNumber(jobMeta.duplicates);
            }
            function formatNumber(n) { return Number(n || 0).toLocaleString(); }
            function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
            function extractUids(line) {
                const text = String(line || "").trim();
                if (!text) return [];
                const found = text.match(/\d{8,20}/g) || [];
                const preferred = found.filter(function (m) { return m.indexOf("615") === 0 || m.indexOf("1000") === 0; });
                const out = [];
                const lead = text.match(/^\s*(\d{8,20})(?:\D|$)/);
                if (lead) out.push(lead[1]);
                preferred.forEach(function (uid) { if (out.indexOf(uid) === -1) out.push(uid); });
                return out;
            }
            function countInputLines(text) {
                const seen = {};
                let count = 0;
                String(text || "").replace(/\r/g, "").split("\n").forEach(function (line) {
                    extractUids(line).forEach(function (uid) { if (seen[uid]) return; seen[uid] = true; count += 1; });
                });
                return count;
            }
            function updateUidCount() { const count = countInputLines(uidInput.value); uidCount.textContent = formatNumber(count) + " / " + formatNumber(cfg.maxUids || 100000); }
            function setTab(tab) {
                activeTab = tab;
                document.querySelectorAll(".seg-btn").forEach(function (el) {
                    const isActive = el.dataset.tab === tab;
                    el.classList.toggle("active", isActive);
                    el.setAttribute("aria-selected", isActive ? "true" : "false");
                });
                const pastePane = document.getElementById("pane-paste");
                const filePane = document.getElementById("pane-file");
                if (pastePane) { pastePane.classList.toggle("active", tab === "paste"); pastePane.hidden = tab !== "paste"; }
                if (filePane) { filePane.classList.toggle("active", tab === "file"); filePane.hidden = tab !== "file"; }
            }
            function showError(message) { errorBanner.textContent = message; errorBanner.classList.remove("hidden"); setCheckingState(false); hideStatusStrip(); checking = false; }
            function hideError() { errorBanner.classList.add("hidden"); errorBanner.textContent = ""; }
            function updateStats(data) {
                const live = data.live != null ? data.live : liveCount;
                const dead = data.dead != null ? data.dead : deadCount;
                let checked = data.checked != null ? data.checked : displayChecked;
                if (!checked && live + dead) { checked = live + dead; }
                if (data.done) { checked = Number(data.unique_total) || Number(data.total_unique) || checked || live + dead; }
                displayChecked = checked;
                statLive.textContent = formatNumber(live);
                statDead.textContent = formatNumber(dead);
                statChecked.textContent = formatNumber(checked);
                liveCountBadge.textContent = formatNumber(live);
                deadCountBadge.textContent = formatNumber(dead);
                const total = live + dead;
                if (statRate) { statRate.textContent = total > 0 ? ((live / total) * 100).toFixed(1) + "%" : "-"; }
                updateEmptyStates();
                updateStatusStrip(data, !!data.done);
            }
            function scrollOutput(el) { if (el) { el.scrollTop = el.scrollHeight; } }
            function appendBatch(batchLive, batchDead) {
                if (Array.isArray(batchLive) && batchLive.length) {
                    liveCount += batchLive.length;
                    liveOutput.value += (liveOutput.value ? "\n" : "") + batchLive.join("\n");
                    scrollOutput(liveOutput);
                }
                if (Array.isArray(batchDead) && batchDead.length) {
                    deadCount += batchDead.length;
                    deadOutput.value += (deadOutput.value ? "\n" : "") + batchDead.join("\n");
                    scrollOutput(deadOutput);
                }
            }
            function resetResults() {
                liveCount = 0; deadCount = 0;
                jobMeta = { inFile: 0, duplicates: 0, invalid: 0 };
                liveOutput.value = ""; deadOutput.value = "";
                if (statInFile) statInFile.textContent = "0";
                if (statDup) statDup.textContent = "0";
                if (statLive) statLive.textContent = "0";
                if (statDead) statDead.textContent = "0";
                if (statChecked) statChecked.textContent = "0";
                if (downloadBtn) downloadBtn.classList.add("hidden");
                displayChecked = 0; checkTotal = 0; liveCursor = 0; deadCursor = 0;
                if (statRate) statRate.textContent = "-";
                if (liveCountBadge) liveCountBadge.textContent = "0";
                if (deadCountBadge) deadCountBadge.textContent = "0";
                if (resultsSub) { resultsSub.textContent = "Streaming as checked…"; }
                hideStatusStrip(); stopProgressPoll(); hideError(); updateEmptyStates();
            }
            function clearAll() {
                if (checking) return;
                uidInput.value = ""; selectedFile = null; fileInput.value = "";
                fileName.textContent = "No file selected";
                dropzone.classList.remove("has-file");
                updateUidCount(); resetResults(); checkBtn.disabled = false; setCheckingState(false);
            }
            function setFile(file) {
                if (!file) return;
                const ext = (file.name.split(".").pop() || "").toLowerCase();
                if (!["xlsx", "csv", "txt"].includes(ext)) { showError("Only .xlsx, .csv, or .txt files are allowed."); return; }
                selectedFile = file;
                fileName.textContent = file.name + " (" + formatBytes(file.size) + ")";
                dropzone.classList.add("has-file");
                setTab("file"); hideError();
            }
            function formatBytes(bytes) {
                if (bytes < 1024) return bytes + " B";
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
                return (bytes / (1024 * 1024)).toFixed(1) + " MB";
            }
            async function fetchStatus(token, sinceLive, sinceDead) {
                const params = new URLSearchParams({ token: token, since_live: String(sinceLive || 0), since_dead: String(sinceDead || 0) });
                const url = (cfg.statusUrl || "/api/status") + "?" + params.toString();
                const res = await fetch(url);
                const data = await res.json();
                if (!data.ok) { throw new Error(data.message || "Could not read progress."); }
                return data;
            }
            function applyStatusUpdate(status) {
                if (Array.isArray(status.batch_live) && status.batch_live.length) { appendBatch(status.batch_live, []); }
                if (Array.isArray(status.batch_dead) && status.batch_dead.length) { appendBatch([], status.batch_dead); }
                if (typeof status.live_cursor === "number") { liveCursor = status.live_cursor; }
                if (typeof status.dead_cursor === "number") { deadCursor = status.dead_cursor; }
                updateStats(status);
            }
            function startProgressPoll(token) {
                stopProgressPoll(); pollInFlight = false;
                const interval = cfg.pollIntervalMs || 250;
                progressPollTimer = setInterval(async function () {
                    if (pollInFlight) return;
                    pollInFlight = true;
                    try { const status = await fetchStatus(token, liveCursor, deadCursor); applyStatusUpdate(status); }
                    catch (err) { }
                    finally { pollInFlight = false; }
                }, interval);
            }
            function requestTimeoutMs(uidCount) {
                const n = Math.max(1, uidCount || checkTotal || cfg.maxUids || 100000);
                return Math.min(2700000, Math.max(300000, n * 200));
            }
            async function postJson(url, body, retries, timeoutMs) {
                const maxRetries = retries == null ? 4 : retries;
                let lastError = null;
                for (let attempt = 0; attempt <= maxRetries; attempt++) {
                    const controller = new AbortController();
                    const waitMs = timeoutMs || requestTimeoutMs(checkTotal);
                    const timer = setTimeout(function () { controller.abort(); }, waitMs);
                    try {
                        const res = await fetch(url, { method: "POST", body: body, signal: controller.signal });
                        clearTimeout(timer);
                        const raw = await res.text();
                        let data;
                        try { data = JSON.parse(raw); } catch (err) { throw new Error("Server timeout or invalid response. Retrying…"); }
                        if (data.retry) { await sleep(600 + attempt * 400); continue; }
                        if (!data.ok) { throw new Error(data.message || "Request failed."); }
                        return data;
                    } catch (err) {
                        clearTimeout(timer);
                        lastError = err;
                        if (attempt >= maxRetries) { break; }
                        await sleep(700 + attempt * 500);
                    }
                }
                throw lastError || new Error("Network error. Please try again.");
            }
            async function showComplete(data) {
                if (Array.isArray(data.live_lines)) { liveOutput.value = data.live_lines.join("\n"); liveCount = data.live_lines.length; }
                if (Array.isArray(data.dead_lines)) { deadOutput.value = data.dead_lines.join("\n"); deadCount = data.dead_lines.length; }
                updateStats(data); updateEmptyStates();
                const hasLive = (data.live || 0) > 0;
                if (data.download_url && hasLive && downloadBtn) { downloadBtn.href = data.download_url; downloadBtn.classList.remove("hidden"); }
                else if (downloadBtn) { downloadBtn.classList.add("hidden"); }
                setCheckingState(false); checking = false;
            }
            // Same Facebook UID status endpoint and response interpretation used by Pro.html.
            async function checkUIDReal(uid) {
                const url = "https://graph.facebook.com/" + encodeURIComponent(uid) + "/picture?type=normal";
                try {
                    const res = await fetch(url, {
                        method: "HEAD",
                        redirect: "follow",
                        cache: "no-store"
                    });
                    return !(res.status === 400 || (res.url && res.url.includes("static")));
                } catch (err) {
                    return false;
                }
            }

            async function readSelectedFile(file) {
                const ext = (file.name.split(".").pop() || "").toLowerCase();
                if (ext === "txt") return await file.text();
                if (ext === "csv") return await file.text();
                if (ext === "xlsx") {
                    if (!window.XLSX) throw new Error("Spreadsheet reader could not load. Please try a .csv or .txt file.");
                    const buffer = await file.arrayBuffer();
                    const workbook = XLSX.read(buffer, { type: "array" });
                    return workbook.SheetNames.map(function (name) {
                        return XLSX.utils.sheet_to_csv(workbook.Sheets[name]);
                    }).join("\n");
                }
                throw new Error("Only .xlsx, .csv, or .txt files are allowed.");
            }

            function collectUniqueUids(text) {
                const seen = new Set();
                const unique = [];
                let duplicates = 0;
                let invalid = 0;
                String(text || "").replace(/\r/g, "").split("\n").forEach(function (line) {
                    const uid = (line.match(/\d{14,16}/) || [])[0];
                    if (!uid) {
                        if (line.trim()) invalid++;
                        return;
                    }
                    if (seen.has(uid)) { duplicates++; return; }
                    seen.add(uid);
                    unique.push(uid);
                });
                return { unique: unique, duplicates: duplicates, invalid: invalid };
            }

            async function runCheck() {
                if (checking) return;
                const pasted = uidInput.value.trim();
                const usingFile = activeTab === "file" && selectedFile;
                if (!pasted && !usingFile) { showError("Paste UIDs or upload a file first."); return; }

                checking = true;
                setCheckingState(true);
                hideError();
                resetResults();
                updateEmptyStates();
                if (statusStrip && statusText) {
                    statusStrip.classList.remove("hidden", "done");
                    statusText.textContent = "Preparing…";
                }

                try {
                    const rawText = usingFile ? await readSelectedFile(selectedFile) : pasted;
                    const parsed = collectUniqueUids(rawText);
                    const unique = parsed.unique;
                    if (unique.length > (cfg.maxUids || 100000)) {
                        throw new Error("Too many UIDs. Maximum allowed: " + formatNumber(cfg.maxUids || 100000) + ".");
                    }

                    jobMeta = { inFile: unique.length + parsed.duplicates, duplicates: parsed.duplicates, invalid: parsed.invalid };
                    statInFile.textContent = formatNumber(jobMeta.inFile);
                    statDup.textContent = formatNumber(jobMeta.duplicates);
                    checkTotal = unique.length;
                    updateStats({ live: 0, dead: 0, checked: 0 });

                    if (!unique.length) {
                        await showComplete({ live: 0, dead: 0, checked: 0, unique_total: 0, done: true });
                        return;
                    }

                    const queue = unique.map(function (uid) { return uid; });
                    const started = Date.now();
                    let checked = 0;
                    const concurrency = 10;

                    async function worker() {
                        while (queue.length) {
                            const uid = queue.shift();
                            const isLive = await checkUIDReal(uid);
                            if (isLive) appendBatch([uid], []);
                            else appendBatch([], [uid]);
                            checked++;
                            updateStats({
                                live: liveCount,
                                dead: deadCount,
                                checked: checked,
                                unique_total: unique.length,
                                done: false
                            });
                            if (statusText) {
                                statusText.textContent = "Checking · " + formatNumber(checked) + " / " + formatNumber(unique.length);
                            }
                        }
                    }

                    await Promise.all(Array.from({ length: Math.min(concurrency, queue.length) }, worker));
                    const elapsed = ((Date.now() - started) / 1000).toFixed(2);
                    await showComplete({
                        live: liveCount,
                        dead: deadCount,
                        checked: checked,
                        unique_total: unique.length,
                        done: true
                    });
                    if (statusStrip && statusText) {
                        statusText.textContent = formatNumber(liveCount) + " live · " +
                            formatNumber(deadCount) + " dead · " + elapsed + "s";
                    }
                } catch (err) {
                    showError(err.message || "Network error. Please try again.");
                }
            }
            async function copyText(kind) {
                const text = kind === "live" ? liveOutput.value : deadOutput.value;
                if (!text) return;
                try { await navigator.clipboard.writeText(text); }
                catch (err) { const el = kind === "live" ? liveOutput : deadOutput; el.focus(); el.select(); document.execCommand("copy"); }
                document.querySelectorAll('.copy-btn[data-copy="' + kind + '"]').forEach(function (btn) {
                    const defaultText = btn.dataset.defaultText || btn.textContent;
                    if (!btn.dataset.defaultText) { btn.dataset.defaultText = defaultText; }
                    btn.classList.add("copied"); btn.textContent = "Copied";
                    setTimeout(function () { btn.classList.remove("copied"); btn.textContent = btn.dataset.defaultText || defaultText; }, 1400);
                });
            }
            document.querySelectorAll(".copy-btn").forEach(function (btn) { btn.dataset.defaultText = btn.textContent.trim(); });
            document.querySelectorAll(".seg-btn").forEach(function (tab) {
                tab.addEventListener("click", function () { if (!checking) setTab(tab.dataset.tab); });
            });
            uidInput.addEventListener("input", updateUidCount);
            fileInput.addEventListener("change", function () { setFile(fileInput.files && fileInput.files[0]); });
            ["dragenter", "dragover"].forEach(function (evt) {
                dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.add("dragover"); });
            });
            ["dragleave", "drop"].forEach(function (evt) {
                dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.remove("dragover"); });
            });
            dropzone.addEventListener("drop", function (e) { const files = e.dataTransfer && e.dataTransfer.files; if (files && files[0]) setFile(files[0]); });
            document.querySelectorAll(".copy-btn").forEach(function (btn) { btn.addEventListener("click", function () { copyText(btn.dataset.copy); }); });
            checkBtn.addEventListener("click", runCheck);
            clearBtn.addEventListener("click", clearAll);
            if (themeBtn) { themeBtn.addEventListener("click", function () { setTheme(getTheme() === "light" ? "dark" : "light"); }); }
            if (downloadBtn) {
                downloadBtn.addEventListener("click", function (e) {
                    const href = downloadBtn.getAttribute("href") || "";
                    if (!href || href === "#") { e.preventDefault(); }
                });
            }
            updateUidCount(); updateEmptyStates(); updateThemeButton(); setTab("paste");
        })();
    </script>
</body>
</html>
